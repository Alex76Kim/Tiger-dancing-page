<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="300" height="350">
  <!-- Tiger Body -->
  <ellipse cx="150" cy="200" rx="80" ry="100" fill="#ff8c42" stroke="#000" stroke-width="2"/>

  <!-- Tiger Stripes on Body -->
  <path d="M 100 170 Q 90 190 100 210" stroke="#000" stroke-width="4" fill="none"/>
  <path d="M 120 160 Q 110 180 120 200" stroke="#000" stroke-width="4" fill="none"/>
  <path d="M 180 160 Q 190 180 180 200" stroke="#000" stroke-width="4" fill="none"/>
  <path d="M 200 170 Q 210 190 200 210" stroke="#000" stroke-width="4" fill="none"/>

  <!-- Tiger Head -->
  <circle cx="150" cy="120" r="60" fill="#ff8c42" stroke="#000" stroke-width="2"/>

  <!-- Tiger Ears -->
  <path d="M 110 80 L 95 60 L 120 70 Z" fill="#ff8c42" stroke="#000" stroke-width="2"/>
  <path d="M 190 80 L 205 60 L 180 70 Z" fill="#ff8c42" stroke="#000" stroke-width="2"/>
  <circle cx="105" cy="70" r="8" fill="#fff"/>
  <circle cx="195" cy="70" r="8" fill="#fff"/>

  <!-- Tiger Face Stripes -->
  <path d="M 125 100 Q 115 110 125 120" stroke="#000" stroke-width="3" fill="none"/>
  <path d="M 175 100 Q 185 110 175 120" stroke="#000" stroke-width="3" fill="none"/>
  <path d="M 135 95 Q 130 105 135 115" stroke="#000" stroke-width="3" fill="none"/>
  <path d="M 165 95 Q 170 105 165 115" stroke="#000" stroke-width="3" fill="none"/>

  <!-- Tiger Eyes -->
  <ellipse cx="130" cy="110" rx="12" ry="15" fill="#fff"/>
  <ellipse cx="170" cy="110" rx="12" ry="15" fill="#fff"/>
  <circle cx="130" cy="115" r="8" fill="#000"/>
  <circle cx="170" cy="115" r="8" fill="#000"/>
  <circle cx="133" cy="112" r="3" fill="#fff"/>
  <circle cx="173" cy="112" r="3" fill="#fff"/>

  <!-- Tiger Nose -->
  <path d="M 145 130 L 150 135 L 155 130 Z" fill="#000"/>
  <line x1="150" y1="135" x2="150" y2="145" stroke="#000" stroke-width="2"/>

  <!-- Tiger Mouth -->
  <path d="M 150 145 Q 135 150 130 145" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 150 145 Q 165 150 170 145" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Tiger Whiskers -->
  <line x1="110" y1="125" x2="75" y2="120" stroke="#000" stroke-width="2"/>
  <line x1="110" y1="130" x2="75" y2="130" stroke="#000" stroke-width="2"/>
  <line x1="110" y1="135" x2="75" y2="140" stroke="#000" stroke-width="2"/>
  <line x1="190" y1="125" x2="225" y2="120" stroke="#000" stroke-width="2"/>
  <line x1="190" y1="130" x2="225" y2="130" stroke="#000" stroke-width="2"/>
  <line x1="190" y1="135" x2="225" y2="140" stroke="#000" stroke-width="2"/>

  <!-- Tiger Arms -->
  <ellipse cx="90" cy="220" rx="25" ry="60" fill="#ff8c42" stroke="#000" stroke-width="2" transform="rotate(-20 90 220)"/>
  <ellipse cx="210" cy="220" rx="25" ry="60" fill="#ff8c42" stroke="#000" stroke-width="2" transform="rotate(20 210 220)"/>

  <!-- Tiger Paws -->
  <ellipse cx="80" cy="270" rx="20" ry="15" fill="#ffa366" stroke="#000" stroke-width="2"/>
  <ellipse cx="220" cy="270" rx="20" ry="15" fill="#ffa366" stroke="#000" stroke-width="2"/>

  <!-- Tiger Legs -->
  <ellipse cx="125" cy="270" rx="20" ry="50" fill="#ff8c42" stroke="#000" stroke-width="2"/>
  <ellipse cx="175" cy="270" rx="20" ry="50" fill="#ff8c42" stroke="#000" stroke-width="2"/>

  <!-- Tiger Feet -->
  <ellipse cx="125" cy="310" rx="22" ry="15" fill="#ffa366" stroke="#000" stroke-width="2"/>
  <ellipse cx="175" cy="310" rx="22" ry="15" fill="#ffa366" stroke="#000" stroke-width="2"/>

  <!-- Tiger Tail -->
  <path d="M 210 190 Q 250 180 270 200 Q 280 220 265 235" stroke="#ff8c42" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 225 195 Q 255 190 265 200" stroke="#000" stroke-width="3" fill="none"/>
  <path d="M 245 210 Q 265 215 270 225" stroke="#000" stroke-width="3" fill="none"/>
</svg>